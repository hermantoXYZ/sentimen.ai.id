<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WapSentimen</title>
  <style>
    body {
      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      background-color: #e5e9f0;
      color: #111;
      margin: 0;
      padding: 8px;
    }
    .wap-container {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #7a96b8;
    }
    .wap-header {
      background: #003366;
      color: #ffffff;
      padding: 6px 8px;
      font-weight: bold;
      border-bottom: 3px solid #ff6600;
    }
    .wap-header span {
      color: #ffcc00;
    }
    .wap-section {
      padding: 10px 8px;
    }
    .wap-title {
      background: #d9e4f2;
      color: #003366;
      font-weight: bold;
      padding: 4px 6px;
      border-top: 1px solid #9bb4d4;
      border-bottom: 1px solid #9bb4d4;
      margin-bottom: 8px;
    }
    .error-box {
      background: #ffe6e6;
      border: 1px solid #cc0000;
      color: #990000;
      padding: 5px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 2px;
    }
    input[type="text"], input[type="password"] {
      width: 96%;
      padding: 4px;
      margin-bottom: 8px;
      border: 1px solid #7a96b8;
      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
    }
    .btn-wap {
      background: #ff6600;
      color: #ffffff;
      border: 1px solid #cc5200;
      padding: 5px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .wap-footer {
      background: #f0f4f8;
      border-top: 1px solid #b8c9de;
      padding: 6px 8px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="wap-container">
    <div class="wap-header">Wap<span>Sentimen</span>.id &raquo; Member Area</div>
    <div class="wap-section">
      <div class="wap-title">[+] Login Akses Pengguna</div>
      {% if error %}
        <div class="error-box">! {{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-wap">Masuk &raquo;</button>
      </form>
    </div>
    <div class="wap-footer">
      Akses terbatas untuk pengguna terdaftar.<br>
      &copy; 2026 WapSentimen Lite
    </div>
  </div>
</body>
</html>
