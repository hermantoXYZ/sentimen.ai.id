{% extends "base.html" %}
{% block content %}
<div class="wap-bar-green d-flex justify-content-between align-items-center">
    <span><i class="fas fa-satellite-dish me-1"></i> Live Sentiment Feed</span>
    <span class="badge bg-light text-danger" style="font-size: 9px;">AUTO-REFRESH 5s</span>
</div>

<div class="wap-stat-grid">
    <div class="wap-stat-box"><span id="livePpm" class="wap-stat-num">0</span><span class="wap-stat-lbl">Posts/m</span></div>
    <div class="wap-stat-box"><span id="livePos" class="wap-stat-num text-success">0%</span><span class="wap-stat-lbl">Pos Rate</span></div>
    <div class="wap-stat-box"><span id="liveNeg" class="wap-stat-num text-danger">0%</span><span class="wap-stat-lbl">Neg Rate</span></div>
    <div class="wap-stat-box"><span id="liveAlerts" class="wap-stat-num text-warning">0</span><span class="wap-stat-lbl">Alerts</span></div>
</div>

<div id="alertListBox" class="p-2 bg-light border-bottom text-center" style="font-size: 11px;">
    Status: Normal (No spike detected)
</div>

<div class="p-2 border-bottom text-center">
    <canvas id="liveGaugeChart" height="130"></canvas>
</div>

<div class="wap-bar-blue">&raquo; Incoming Stream</div>
<div id="liveStreamBox" class="p-2" style="max-height: 360px; overflow-y: auto;"></div>
{% endblock %}
